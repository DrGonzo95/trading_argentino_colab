name: Paper portfolio - fail closed
on:
  push:
    paths:
      - 'radar_byma/paper_portfolio.py'
      - 'radar_byma/test_paper_portfolio.py'
      - '.github/workflows/paper_portfolio.yml'
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Radar CEDEAR - estudiar acciones originales USD"
    types: [completed]
permissions:
  contents: write
concurrency:
  group: paper-portfolio-ledger
  cancel-in-progress: false
jobs:
  paper:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public data dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate paper ledger
        run: python -m unittest discover -s radar_byma -p 'test_paper_portfolio.py' -v
      - name: Read research and update USD paper ledger
        run: python radar_byma/paper_portfolio.py
      - name: Persist paper ledger
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add docs/data/paper_portfolio.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh USD-only paper ledger [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
