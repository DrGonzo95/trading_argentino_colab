name: PULSO BYMA - dashboard web de oportunidades
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/index.html'
      - 'docs/styles.css'
      - 'docs/app.js'
      - 'docs/charts.js'
      - 'docs/charts_v3.js'
      - 'radar_byma/quote_crosscheck.py'
      - 'radar_byma/chart_expand.py'
      - 'radar_byma/forward_report.py'
      - 'radar_byma/recommendations.py'
      - 'tests/recommendations_test.py'
      - 'docs/pro.js'
      - 'docs/pro.css'
      - 'radar_byma/strategy_audit.py'
      - 'docs/pwa.js'
      - 'docs/sw.js'
      - 'docs/manifest.webmanifest'
      - 'docs/icon.svg'
      - 'radar_byma/dashboard_charts.py'
      - 'radar_byma/dashboard_export.py'
      - 'radar_byma/dashboard_markdown.py'
      - '.github/workflows/byma_dashboard_pages.yml'
  schedule:
    - cron: '7,22,37,52 13-21 * * 1-5'
    - cron: '7,37 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: pulso-byma-pages-public
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies without private API keys
        run: pip install requests beautifulsoup4 pandas numpy
      - name: Scan delayed public quote panels
        run: python radar_byma/discover_byma.py
      - name: Confirm daily historical data and theoretical paper levels
        run: python radar_byma/rank_byma.py
      - name: Export complete market dashboard with data quality warnings
        run: python radar_byma/dashboard_export.py
      - name: Export validated daily candles for professional trading chart
        run: python radar_byma/dashboard_charts.py
      - name: Expand daily historical chart coverage without filling missing candles
        run: MAX_EXTRA_CHART_REQUESTS=26 python radar_byma/chart_expand.py
      - name: Independent closing-price crosscheck (second public provider)
        run: python radar_byma/quote_crosscheck.py
      - name: Audit RSI35 strategy without lookahead or synthetic prices
        run: python radar_byma/strategy_audit.py
      - name: Export prospective paper tracking without inventing trades
        run: python radar_byma/forward_report.py
      - name: Explain what to do with every stock, CEDEAR, bond and note
        run: python radar_byma/recommendations.py
      - name: Render public GitHub opportunity bulletin
        run: python radar_byma/dashboard_markdown.py
      - name: Validate browser code and market data
        run: |
          node --check docs/app.js
          node --check docs/charts.js
          node --check docs/charts_v3.js
          node --check docs/pro.js
          node --check docs/pwa.js
          node --check docs/sw.js
          python -m py_compile radar_byma/dashboard_export.py radar_byma/dashboard_charts.py radar_byma/dashboard_markdown.py radar_byma/strategy_audit.py radar_byma/quote_crosscheck.py radar_byma/chart_expand.py radar_byma/forward_report.py radar_byma/recommendations.py
          python tests/recommendations_test.py
          test -s OPORTUNIDADES.md
          python -m json.tool docs/data/market.json >/dev/null
          python -m json.tool docs/data/charts.json >/dev/null
          python -m json.tool docs/data/quote_check.json >/dev/null
          python -m json.tool docs/data/forward_status.json >/dev/null
          python -m json.tool docs/data/strategy_audit.json >/dev/null
          python -m json.tool docs/manifest.webmanifest >/dev/null
          test -s docs/data/market.json
          test -s docs/data/charts.json
      - name: Persist delayed radar JSON and public opportunities, conflict safely
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cp docs/data/market.json /tmp/byma_market.json
          cp docs/data/charts.json /tmp/byma_charts.json
          cp docs/data/quote_check.json /tmp/byma_quote_check.json
          cp docs/data/forward_status.json /tmp/byma_forward_status.json
          cp docs/data/strategy_audit.json /tmp/byma_strategy_audit.json
          cp OPORTUNIDADES.md /tmp/byma_opportunities.md
          for n in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/data
            cp /tmp/byma_market.json docs/data/market.json
            cp /tmp/byma_charts.json docs/data/charts.json
            cp /tmp/byma_quote_check.json docs/data/quote_check.json
            cp /tmp/byma_forward_status.json docs/data/forward_status.json
            cp /tmp/byma_strategy_audit.json docs/data/strategy_audit.json
            cp /tmp/byma_opportunities.md OPORTUNIDADES.md
            git add docs/data/market.json docs/data/charts.json docs/data/quote_check.json docs/data/strategy_audit.json docs/data/forward_status.json OPORTUNIDADES.md
            if git diff --cached --quiet; then
              echo "No public radar changes"
              exit 0
            fi
            git commit -m "Refresh public BYMA opportunities and delayed JSON [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            echo "Concurrent commit detected; retrying with fresh branch head: $n"
            sleep 1
          done
          echo "::error::Could not update public opportunities after three attempts"
          exit 1
      - name: Report public site activation instructions
        run: |
          echo "Static HTML/JS and docs/data/market.json are updated successfully."
          echo "GitHub Actions cannot create/enable Pages due insufficient integration permissions."
          echo "Repository owner must open Settings > Pages and select Source: Deploy from a branch; Branch: main; Folder: /docs."
          echo "The branch-published page will then update automatically when docs/data/market.json changes."
          echo "Do not claim the public site is live until repository Pages is enabled."
