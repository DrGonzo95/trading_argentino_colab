name: "Estudio independiente IOL - una ejecución sin radar"
on:
  push:
    branches:
      - estudio-iol-independiente-20261105
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar calculo
        run: python -m pip install --disable-pip-version-check numpy pandas requests lxml
      - name: Descargar y calcular cuatro especies BCBA
        run: python estudio_independiente_20261105.py
      - name: Guardar informe y CSVs independientemente del resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estudio-iol-independiente-20261105
          path: informe_iol_independiente/
          if-no-files-found: warn
