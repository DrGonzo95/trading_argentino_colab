name: Radar BYMA - datos publicos y simulacion
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/runner.py'
      - 'radar_byma/research_advanced.py'
      - 'radar_byma/dual_monitor.py'
      - 'radar_byma/challenger_rsi35.py'
      - 'radar_byma/watch_universe.py'
      - 'radar_byma/rank_byma.py'
      - 'radar_byma/fusion_byma.py'
      - 'radar_byma/discover_byma.py'
      - '.github/workflows/radar_byma.yml'
  schedule:
    - cron: '35 13-20 * * 1-5'
    - cron: '15 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: radar-byma-main
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests beautifulsoup4
      - name: Discover public stocks, CEDEARs, bonds and notes (delayed panels)
        run: python radar_byma/discover_byma.py
      - name: Run paper-trading radar with public historical data
        run: python radar_byma/runner.py
      - name: Test advanced strategies with untouched holdout
        run: python radar_byma/research_advanced.py
      - name: Categorize Argentine stocks, CEDEARs, and sovereign bonds
        run: python radar_byma/watch_universe.py
      - name: Rank all public BYMA quotes and corroborate equity candidates on histories
        run: python radar_byma/rank_byma.py
      - name: Fuse technical, official filings, numerical statements and news evidence
        run: python radar_byma/fusion_byma.py
      - name: Monitor RSI14 paper forward and indicative caucion yields
        run: python radar_byma/dual_monitor.py
      - name: Run frozen RSI35 challenger on future completed bars (paper only)
        run: python radar_byma/challenger_rsi35.py
      - name: Save simulation ledger between runs
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add radar_byma/state/paper_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper-trading ledger [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-byma-report
          path: resultados/
          if-no-files-found: warn
          retention-days: 30
