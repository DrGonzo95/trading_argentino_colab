name: Radar BYMA - datos publicos y simulacion
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/runner.py'
      - 'radar_byma/research_advanced.py'
      - 'radar_byma/forward_monitor.py'
      - '.github/workflows/radar_byma.yml'
  schedule:
    - cron: '35 13-20 * * 1-5'
    - cron: '15 22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: radar-byma-main
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests beautifulsoup4
      - name: Run paper-trading radar with public historical data
        run: python radar_byma/runner.py
      - name: Test advanced strategies with untouched holdout
        run: python radar_byma/research_advanced.py
      - name: Monitor RSI14 forward and indicative caucion yields
        run: python radar_byma/forward_monitor.py
      - name: Save simulation ledger between runs
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add radar_byma/data/forward_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update paper-trading ledger [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-byma-report
          path: resultados/
          if-no-files-found: warn
          retention-days: 30
