name: Radar BYMA - datos publicos y simulacion
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/runner.py'
      - 'radar_byma/research_advanced.py'
      - '.github/workflows/radar_byma.yml'
  schedule:
    - cron: '35 13-20 * * 1-5'
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy requests beautifulsoup4
      - name: Run paper-trading radar with public historical data
        run: python radar_byma/runner.py
      - name: Test advanced strategies with untouched holdout
        run: python radar_byma/research_advanced.py
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-byma-report
          path: resultados/
          if-no-files-found: warn
          retention-days: 30
