name: Radar BYMA - fundamentales SEC XBRL
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/financials_sec.py'
      - 'radar_byma/financials_arg.py'
      - '.github/workflows/byma_fundamentales.yml'
  schedule:
    - cron: '5 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: byma-sec-companyfacts
  cancel-in-progress: true
jobs:
  structured-financials:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Discover public IOL list for Argentine issuer coverage
        run: python radar_byma/discover_byma.py
      - name: Read issuer-owned numeric Argentine tables conservatively
        run: python radar_byma/financials_arg.py
      - name: Read numerical SEC companyfacts without auth keys
        run: python radar_byma/financials_sec.py
      - name: Persist latest verified fundamental source status
        run: |
          cp resultados/fundamentales/arg_estado.json radar_byma/state/arg_latest.json
          cp resultados/fundamentales/sec_estado.json radar_byma/state/sec_latest.json
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add radar_byma/state/arg_latest.json radar_byma/state/sec_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified numeric fundamentals or source outage status [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload filing-date aware numerical ratios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byma-sec-fundamentals
          path: resultados/fundamentales/
          if-no-files-found: warn
          retention-days: 30
