name: Radar BYMA - paneles publicos (observacion)
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/discover_byma.py'
      - '.github/workflows/byma_paneles.yml'
  schedule:
    - cron: '10,40 13-21 * * 1-5'
permissions:
  contents: read
concurrency:
  group: byma-public-panels
  cancel-in-progress: true
jobs:
  public-panels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - name: Fetch all available public delayed panel quotes
        run: python radar_byma/discover_byma.py
      - name: Save quotes and scan validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byma-paneles-publicos
          path: resultados/discovery/
          retention-days: 7
          if-no-files-found: warn
