name: Radar BYMA - hechos, balances y noticias publicas
on:
  workflow_dispatch:
  push:
    paths:
      - 'radar_byma/events_public.py'
      - 'radar_byma/events_study.py'
      - '.github/workflows/byma_eventos.yml'
  schedule:
    - cron: '20 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: byma-events-official-and-news
  cancel-in-progress: true
jobs:
  public-events:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4 pandas
      - name: Discover all visible Argentine listed shares
        run: python radar_byma/discover_byma.py
      - name: Monitor CNV filings, company-name news and optional public social discussion
        run: python radar_byma/events_public.py
      - name: Archive events when first observed and run gated forward-safe event study
        run: python radar_byma/events_study.py
      - name: Persist first-seen event history without changing paper trades
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          cp resultados/eventos/reporte.json radar_byma/state/events_latest.json
          cp resultados/eventos/prediccion_estado.json radar_byma/state/events_study_latest.json
          git add radar_byma/state/event_history.json radar_byma/state/events_latest.json radar_byma/state/events_study_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record first-seen public event dates [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve published events, dates and source links
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eventos-balance-noticias-byma
          path: |
            resultados/eventos/
            resultados/discovery/snapshot.json
          retention-days: 30
          if-no-files-found: warn
